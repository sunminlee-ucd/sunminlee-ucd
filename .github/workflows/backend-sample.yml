name: Backend session sample

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/plug-and-wifi/examples
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test lifecycle, rollback, persistence and concurrent refresh
        run: python -m unittest -v test_refresh_sessions
      - name: Run synthetic lifecycle trace
        run: python demo.py
      - name: Smoke-test measurement command without a latency threshold
        run: python benchmark.py --iterations 20
